name: Build Folder Preview APK

on:
  push:
    branches: [ main, feature/folder-identity-preview-20261122 ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore large test source files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('.translation-build-input')
          for entry in json.loads((root / 'manifest.json').read_text()):
              encoded = ''.join((root / name).read_text() for name in entry['parts'])
              data = zlib.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              path = pathlib.Path(entry['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY

      # This preview uses a checked, compressed source overlay to transport large files.
      - name: Restore and verify preview source overlay
        run: |
          python3 - <<'PYOVERLAY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('.folder-preview-input')
          parts = sorted(root.glob('*.part'))
          assert len(parts) == 21
          raw = zlib.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'e158f41dce014456ba9b16b32a73af0302160190b66504b6761c117ad1b0fe15'
          files = json.loads(raw)
          assert len(files) == 43
          for name, content in files.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('app', 'tests', 'docs', '.translation-build-input')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          PYOVERLAY

      - name: Fetch libmobi v0.12
        run: |
          rm -rf app/src/main/cpp/libmobi
          git clone --depth 1 --branch v0.12 https://github.com/bfabiszewski/libmobi.git app/src/main/cpp/libmobi
          cp app/src/main/cpp/config.h app/src/main/cpp/libmobi/config.h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/persistent.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build compatible Foxlet engine from pinned source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"
          git clone --branch v0.5.0 --depth 1 https://github.com/yinvoke/foxlet-translate.git "$RUNNER_TEMP/foxlet-source"
          test "$(git -C "$RUNNER_TEMP/foxlet-source" rev-parse HEAD)" = "0eff2a15032362115848a496ce1df8ed9fc68650"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foxlet-source/foxlet/build.gradle.kts'
          text = p.read_text()
          old = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }'
          new = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17); languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1); apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1) }'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_ndk = 'ndkVersion = "29.0.13113456"'
          new_ndk = 'ndkVersion = "26.1.10909125"'
          assert text.count(old_ndk) == 1
          p.write_text(text.replace(old_ndk, new_ndk))
          PY
          (cd "$RUNNER_TEMP/foxlet-source" && ./gradlew :foxlet:assembleRelease)
          cp "$RUNNER_TEMP/foxlet-source/foxlet/build/outputs/aar/foxlet-release.aar" "$RUNNER_TEMP/foxlet.aar"

      - name: Build folder preview with Foxlet
        run: gradle clean assembleDebug -PfoxletAar="$RUNNER_TEMP/foxlet.aar"

      - name: Verify preview APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          tools_dir=""
          while IFS= read -r candidate; do
            if [[ -x "$candidate/aapt" && -x "$candidate/apksigner" ]]; then
              tools_dir="$candidate"
              break
            fi
          done < <(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -Vr)
          test -n "$tools_dir"
          package_line=$("$tools_dir/aapt" dump badging "$apk" | grep '^package: ')
          if [[ ! "$package_line" =~ ^package:\ name=\'([^\']+)\' ]]; then
            echo "Could not parse APK package name" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "com.example.myebookapp.foxlet.folderpreview20261122" ]]; then
            echo "Unexpected APK package name: ${BASH_REMATCH[1]}" >&2
            exit 1
          fi
          "$tools_dir/apksigner" verify --verbose "$apk"

      - name: Upload folder preview APK
        id: upload_preview
        uses: actions/upload-artifact@v4
        with:
          name: MyEbookApp-Foxlet-Folder-Preview-20261122
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload_preview.outputs.artifact-url }}
        run: |
          test -n "$ARTIFACT_URL"
          printf '[Download the folder preview artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

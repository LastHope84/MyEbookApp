name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_FEATURES: "Folder library with search, favorites, reading shelves and custom shelves; built-in Comics, PDFs and unshelved shelves; A–Z index rail for large shelves; saved quotes with copy, share and reopen; removed books stay removed; EPUB reader with themes and read-aloud; comic and PDF readers with zoom, text selection, search and read-aloud; offline translation packs; MOBI/AZW3 to EPUB conversion; metadata editing and covers; backup and restore."
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch libmobi v0.12
        run: |
          rm -rf app/src/main/cpp/libmobi
          git clone --depth 1 --branch v0.12 https://github.com/bfabiszewski/libmobi.git app/src/main/cpp/libmobi
          cp app/src/main/cpp/config.h app/src/main/cpp/libmobi/config.h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/persistent.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build compatible Foxlet engine from pinned source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6"
          git clone --branch v0.5.0 --depth 1 https://github.com/yinvoke/foxlet-translate.git "$RUNNER_TEMP/foxlet-source"
          test "$(git -C "$RUNNER_TEMP/foxlet-source" rev-parse HEAD)" = "0eff2a15032362115848a496ce1df8ed9fc68650"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foxlet-source/foxlet/build.gradle.kts'
          text = p.read_text()
          old = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }'
          new = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17); languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1); apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1) }'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_ndk = 'ndkVersion = "29.0.13113456"'
          new_ndk = 'ndkVersion = "26.1.10909125"'
          assert text.count(old_ndk) == 1
          p.write_text(text.replace(old_ndk, new_ndk))
          PY
          (cd "$RUNNER_TEMP/foxlet-source" && ./gradlew :foxlet:assembleRelease)
          cp "$RUNNER_TEMP/foxlet-source/foxlet/build/outputs/aar/foxlet-release.aar" "$RUNNER_TEMP/foxlet.aar"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug -PfoxletAar="$RUNNER_TEMP/foxlet.aar"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyEbookApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish latest build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyEbookApp-latest.apk
          NOTES=$(printf '%s\n\n%s\n\n%s' \
            "MyEbookApp is a personal Android ebook reader for EPUB, CBZ/CBR comics and PDF, with offline translation and MOBI/AZW3 conversion." \
            "This is an automated debug build from commit $GITHUB_SHA on the main branch. Debug-signed with the project keystore; install it over a build with the same signature." \
            "Features: $APP_FEATURES")
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "$GITHUB_SHA" --notes "$NOTES"
            gh release upload latest MyEbookApp-latest.apk --clobber
          else
            gh release create latest MyEbookApp-latest.apk \
              --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "$NOTES"
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MyEbookApp-${GITHUB_REF_NAME}.apk"
          NOTES=$(printf '%s\n\n%s\n\n%s' \
            "MyEbookApp is a personal Android ebook reader for EPUB, CBZ/CBR comics and PDF, with offline translation and MOBI/AZW3 conversion." \
            "Built from commit $GITHUB_SHA." \
            "Features: $APP_FEATURES")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "MyEbookApp-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "MyEbookApp-${GITHUB_REF_NAME}.apk" \
              --title "MyEbookApp ${GITHUB_REF_NAME}" \
              --notes "$NOTES"
          fi

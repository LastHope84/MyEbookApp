name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch libmobi v0.12
        run: |
          rm -rf app/src/main/cpp/libmobi
          git clone --depth 1 --branch v0.12 https://github.com/bfabiszewski/libmobi.git app/src/main/cpp/libmobi
          cp app/src/main/cpp/config.h app/src/main/cpp/libmobi/config.h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/persistent.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Download and verify Foxlet test engine
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/foxlet.aar" https://github.com/yinvoke/foxlet-translate/releases/download/v0.5.0/foxlet-v0.5.0.aar
          echo "5dbb384907d69c2aba129fd15dba30dda94ede0fa556dc6a167d041ee479ec0e  $RUNNER_TEMP/foxlet.aar" | sha256sum -c -

      - name: Build experimental translation APK
        run: gradle assembleDebug -PfoxletAar="$RUNNER_TEMP/foxlet.aar"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyEbookApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

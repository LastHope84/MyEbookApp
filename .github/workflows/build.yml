name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore large test source files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('.translation-build-input')
          for entry in json.loads((root / 'manifest.json').read_text()):
              encoded = ''.join((root / name).read_text() for name in entry['parts'])
              data = zlib.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              path = pathlib.Path(entry['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY

      - name: Fetch libmobi v0.12
        run: |
          rm -rf app/src/main/cpp/libmobi
          git clone --depth 1 --branch v0.12 https://github.com/bfabiszewski/libmobi.git app/src/main/cpp/libmobi
          cp app/src/main/cpp/config.h app/src/main/cpp/libmobi/config.h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/persistent.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build compatible Foxlet engine from pinned source
        run: |
          git clone --branch v0.5.0 --depth 1 https://github.com/yinvoke/foxlet-translate.git "$RUNNER_TEMP/foxlet-source"
          test "$(git -C "$RUNNER_TEMP/foxlet-source" rev-parse HEAD)" = "0eff2a15032362115848a496ce1df8ed9fc68650"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foxlet-source/foxlet/build.gradle.kts'
          text = p.read_text()
          old = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }'
          new = 'compilerOptions { jvmTarget.set(JvmTarget.JVM_17); languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1); apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1) }'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          (cd "$RUNNER_TEMP/foxlet-source" && ./gradlew :foxlet:assembleRelease)
          cp "$RUNNER_TEMP/foxlet-source/foxlet/build/outputs/aar/foxlet-release.aar" "$RUNNER_TEMP/foxlet.aar"

      - name: Build experimental translation APK
        run: gradle assembleDebug -PfoxletAar="$RUNNER_TEMP/foxlet.aar"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyEbookApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
